[ec2] # AWS configurations
security_group = # Security group created (with all traffic inbound and outbound freed)
security_vpc_group = default # VPC group used
key_name = # SSH key name created 
tag_key = # Tag to diferentiate the instances
tag_value = # Value of the tag above
home_path = # VM home path
input_path = # VM path to mount extra persistent disk
region = # Default region to use
zone = # Default zone to use
boot_overhead = 180 # Overhead in seconds to start VM
interruption_overhead = 180 # Overhead in seconds to interrupt VM
vm_user = ubuntu # VM user to connect via SSH
key_path = # Path to the VM's key in local machine

[s3]
bucket_name = # AWS bucket to store checkpoints
vm_uid = 1000 # VM user id to mount bucket (do not change)
vm_gid = 1000 # VM group id to mount bucket (do not change)

[storage]
bucket_name = # GCP bucket to store checkpoints

[gcp]
project = # GCP project
region = # Default region to use
zone = # Default zone to use
network = default # Network interface
disk_type = pd-balanced # Persistent extra disk type
home_path = # VM home path
input_path = # VM path to mount extra persistent disk
credentials_file = # JSON file with the service account info
vm_user = sa_109649273287045369425 # VM user to connect via service account and gcloud (sa_{client_id})
aws_settings = # JSON file with AWS settings to access checkpoint bucket
gid = 290035855 # VM user id to mount bucket (do not change)
uid = 290035855 # VM group id to mount bucket (do not change)

[application]
daemon_path = $HOME/control-gpu/control/daemon/ # Folder in which the VM daemons are (do not change)
daemon_aws_file = daemon_manager_new_AWS.py # Daemon used in AWS (do not change)
daemon_gcp_file = daemon_manager_new_GCP.py # Daemon used in GCP (do not change)
fl_framework = flower # FL framework used (currently supporting Flower version 1.30 [flower] and version 0.19.0 [flower_old])
fl_port = 9092 # Port to connect FL clients to FL server
data_path = $HOME/control-gpu/data/ # Local folder containing MNIST data (used only in initial FL tests)
dataset = mnist # Dataset chosen (used only in initial FL tests)
app = empty # Aplication to be executed (currently working with Tumor-Infiltrating Lymphonodes [TIL] and dummy app [empty])

[communication]
ssh_port = 22 # Port used to connect in AWS VMs via SSH
repeat = 5 # Number of tries to connect to a VM before giving up
connection_timeout = 30 # SSH connection timeout
retry_interval = 10 # Seconds between consecutive connection tests
socket_port = 8080 # Daemon socket port in cloud VM

[logging]
path = $PWD/logs/ # Folder to save logs
log_file = exec_log # File to save logs
level = INFO # Default logging level

[debug]
debug_mode = no # True (yes) to print debug messages

[file_system]
type = ebs # Extra disk type
size = 10 # Extra disk size
path = data/ # Folder to mount extra disk
path_storage = bucket_folder/ # Folder to connect client bucket (AWS or GCP)
ebs_delete = no # True (yes) to delete extra disk in VM termination

[checkpoint]
with_checkpoint = # True (yes) to start checkpoint module
server_checkpoint = # True (yes) to enable server checkpoint
daemon_fault_tolerance_cloudlab = daemon_FT_CloudLab.py # Checkpoint daemon in CloudLab environment (do not change)
daemon_fault_tolerance_bucket = daemon_FT_bucket.py # Checkpoint daemon in AWS/GCP environment (do not change)
extra_vm = no # True (yes) if an extra VM is needed (only in CloudLab)
client_checkpoint = # True (yes) to enable client checkpoint
ckpt_file = checkpoint.txt # File used to register all server checkpoints
frequency_ckpt = # Checkpoint frequency (each X rounds)
folder_checkpoints = checkpoints/ # Folder to connect checkpoint bucket in server
provider_bucket = # Provider of the checkpoint server (gcp or aws)

[input]
path = # Path to the input JSONs 
job_file = job.json # JSON file describing the application (caution on change)
env_file = instances.json # JSON file describing the available instances (caution on change)
loc_file = locations.json # JSON file describing the available regions (caution on change)
pre_file = presched.json # JSON file containing the Pre-Scheduling values (only change before executing this module) 
input_file = input.json # JSON file with Initial Mapping variables (only change before executing Pre-Scheduling module)
map_file = map.json # JSON file containing Initial Mapping scheduling decision (only change before executing this module)
deadline_seconds = # Deadline to be met in seconds
task_leaf = # True (yes) if using the LEAF datasets

[database]
user = postgres # User to connect to DB (do not change)
password = rafaela123 # Password to connect to DB (do not change)
host = localhost # IP to connect in DB
database_name = controlgpudb # DB name (do not change)
dump_dir = $HOME/storage/dump/ # DB dump folder
with_dump = # True (yes) to dump DB information in dump_dir

[simulation]
with_simulation = # True (yes) to start fault simulation module
faulty_server = # True (yes) to connect the fault simulation to the server
faulty_clients = # True (yes) to connect the fault simulation to each client
revocation_rate = # Rate in which the revocations can occur (between 0.0 and 1.0)

[pre_sched]
path = $HOME/control-gpu/control/pre_scheduling # Folder containing files used by Pre Scheduling module (do not change)
rtt_file_aws = test_rtt_aws.py # RTT test file to AWS (do not change)
rtt_file_gcp = test_rtt_gcp.py # RTT test file to GCP (do not change)
train_file = main_training_empty.py # Application test file (do not change)
app_file = cnn_app.zip # Application .zip file
results_temp_file = times.json # temporary JSON file with values from one test
rpc_file = dummy_new_files.zip # RPC files to sent to VM
client_file = client_app.py # Client test file
server_file = server_app.py # Server test file
length_msg = 25000000 # Size of message to be tested
num_clients = 1 # Number of concurrent clients to be tested
num_rounds = 1 # Number of rounds to be tested
clients_baseline = 0,2 # Clients ID to be used as baselines

[mapping]
budget = 300000 # Maximum budget to Initial Mapping problem
deadline = 100000 # Maximum deadline to Initial Mapping problem
alpha = 0.5 # Alpha value to combine both objectives
scheduler_name = greedy # Which schedule to use: Dynamic Scheduler with greedy algorithm [greedy], only Static Scheduler with mathematical formulation [formulation] and without scheduler, use given configuration [simple]